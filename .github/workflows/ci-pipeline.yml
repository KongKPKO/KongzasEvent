name: Full Stack QA Pipeline 🚀

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    steps:
      # 1. ดึงโค้ดล่าสุดลงมา
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. ติดตั้ง Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. ติดตั้ง K6 (สำหรับ Load Test)
      - name: Setup K6
        uses: grafana/setup-k6-action@v1

      # 4. ติดตั้ง Dependency ทั้งหมด
      - name: Install Dependencies
        run: npm ci

      # 5. ติดตั้ง Browser สำหรับ Playwright
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 6. เริ่มรัน Server (Frontend) แบบ Background
      - name: Start Frontend App
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
        run: |
          npm run dev -- --host &
          npx wait-on tcp:5173 --timeout 60000

      # 7. รัน Security Tests
      - name: 🔒 Run Security Tests
        run: npx playwright test security.spec.ts --project=chromium
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          TEST_EMAIL: ${{ vars.TEST_USER_A_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_USER_A_PASS }}
          TEST_USER_B_EMAIL: ${{ vars.TEST_USER_B_EMAIL }}
          TEST_USER_B_PASS: ${{ secrets.TEST_USER_B_PASS }}

      # 8. รัน Resilience Tests
      - name: 💪 Run Resilience Tests
        run: npx playwright test resilience.spec.ts --project=chromium
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          TEST_EMAIL: ${{ vars.TEST_USER_A_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_USER_A_PASS }}

      # 9. รัน E2E Tests
      - name: 🔄 Run E2E Tests (Full Service Loop)
        run: npx playwright test full-service-loop.spec.ts --project=chromium
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          TEST_EMAIL: ${{ vars.TEST_USER_A_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_USER_A_PASS }}

      # 10. รัน Performance Tests
      - name: ⚡ Run Performance Tests
        run: npx playwright test performance.spec.ts --project=chromium
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          TEST_EMAIL: ${{ vars.TEST_USER_A_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_USER_A_PASS }}

      # 11. รัน Mobile Responsive Tests
      - name: 📱 Run Mobile Responsive Tests
        run: npx playwright test mobile-responsive.spec.ts --project=chromium
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          TEST_EMAIL: ${{ vars.TEST_USER_A_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_USER_A_PASS }}

      # 12. รัน Offline/Network Tests
      - name: 📡 Run Offline & Network Tests
        run: npx playwright test offline-poor-network.spec.ts --project=chromium
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          TEST_EMAIL: ${{ vars.TEST_USER_A_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_USER_A_PASS }}

      # 13. รัน Accessibility Tests
      - name: ♿ Run Accessibility Tests (WCAG 2.1)
        run: npx playwright test accessibility.spec.ts --project=chromium
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          TEST_EMAIL: ${{ vars.TEST_USER_A_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_USER_A_PASS }}

      # 14. รัน Browser Compatibility Tests (Cross-browser)
      - name: 🌐 Run Browser Compatibility Tests
        run: npx playwright test browser-compatibility.spec.ts
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          TEST_SLUG: ${{ vars.TEST_SLUG || 'test1' }}

      # 15. รัน Load Test (30 VUs - Realistic Event Load)
      - name: 🔥 Run Load Test (30 Concurrent Users)
        run: k6 run -e SUPABASE_KEY=${{ secrets.VITE_SUPABASE_KEY }} -e SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }} -e ARTIST_SLUG=test1 src/tests/load-test.k6.ts

      # 16. รัน K6 Soak Test (Extended API Performance)
      - name: 🔥 Run K6 Soak Test (API Performance)
        run: k6 run -e SUPABASE_KEY=${{ secrets.VITE_SUPABASE_KEY }} -e SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }} -e ARTIST_SLUG=test1 src/tests/api-soak-test.js

      # 17. เก็บผลเทสไว้ดู (Artifacts)
      - name: 📊 Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # 18. Upload Test Screenshots (if any failure)
      - name: 📸 Upload Test Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7

      # 19. Upload Browser Compatibility Screenshots
      - name: 📸 Upload Browser Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: screenshots/
          retention-days: 14
