name: Full Stack QA Pipeline 🚀

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & Test (Playwright + K6)
    runs-on: ubuntu-latest

    steps:
      # 1. ดึงโค้ดล่าสุดลงมา
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. ติดตั้ง Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. ติดตั้ง K6 (สำหรับ Load Test)
      - name: Setup K6
        uses: grafana/setup-k6-action@v1

      # 4. ติดตั้ง Dependency ทั้งหมด
      - name: Install Dependencies
        run: npm ci

      # 5. ติดตั้ง Browser สำหรับ Playwright
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # ❌ ลบ Step "Start Supabase (Local in CI)" ทิ้งไปเลย
      # เพราะเราจะใช้ Supabase ของจริงผ่าน Secrets แทน เพื่อให้มี User A/B ให้เทส

      # 6. เริ่มรัน Server (Frontend) แบบ Background
      # ต้องส่ง ENV เข้าไปให้ Frontend รู้จักด้วย ว่าต่อ Supabase ตัวไหน
      - name: Start Frontend App
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_KEY }} # ใช้ชื่อตัวแปรตามที่ Project ใช้
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }} # กันเหนียวเผื่อบางจุดเรียกใช้อันนี้
        run: |
          npm run dev -- --host &
          npx wait-on tcp:5173 # รอจนกว่า port 5173 จะพร้อมใช้งาน

      # 7. รัน Functional Test & Security Test (Playwright)
      - name: 🧪 Run Playwright Tests (Functional & Security)
        run: npx playwright test
        env:
          # ENV หลักสำหรับ Playwright
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}

          # Credential ของ User A (Artist หลัก)
          TEST_USER_A_EMAIL: ${{ vars.TEST_USER_A_EMAIL }}
          TEST_USER_A_PASS: ${{ secrets.TEST_USER_A_PASS }}

          # Credential ของ User B (คนนอก เอาไว้เทส Security)
          TEST_USER_B_EMAIL: ${{ vars.TEST_USER_B_EMAIL }}
          TEST_USER_B_PASS: ${{ secrets.TEST_USER_B_PASS }}

      # 8. รัน Load/Soak Test (K6)
      - name: 🔥 Run K6 Soak Test (Backend Performance)
        # ส่งค่า Key เข้าไปใน K6 script
        run: k6 run -e SUPABASE_KEY=${{ secrets.VITE_SUPABASE_KEY }} -e SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }} src/tests/api-soak-test.js

      # 9. เก็บผลเทสไว้ดู (Artifacts)
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
