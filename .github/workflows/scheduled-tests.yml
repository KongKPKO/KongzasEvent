name: Scheduled E2E Tests

on:
  schedule:
    # Run at 00:00 on day-of-month 1 and 15
    - cron: "0 0 1,15 * *"
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  test_and_notify:
    name: Run Tests & Email
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        id: run_tests
        run: npx playwright test

      - name: Send Email Notification
        if: always() # Run even if tests fail so we get a failure report
        uses: dawidd6/action-send-mail@v3
        with:
          # Required mail server address:
          server_address: smtp.gmail.com
          # Required mail server port:
          server_port: 465
          # Optional (recommended): mail server username:
          username: ${{ secrets.MAIL_USERNAME }}
          # Optional (recommended) mail server password:
          password: ${{ secrets.MAIL_PASSWORD }}
          # Required mail subject:
          subject: EventWebQueue E2E Test Report - ${{ job.status }}
          # Required recipients addresses:
          to: ${{ secrets.MAIL_TO }}
          # Required sender full name (optional):
          from: GitHub Actions <noreply@github.com>
          # Optional plain body:
          body: |
            The bi-weekly E2E test run has completed.

            Status: ${{ job.status }}

            View full results here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
